version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BOTSHIELD_ENV=production
      - BOTSHIELD_HOST=0.0.0.0
      - BOTSHIELD_PORT=8000
      - DATABASE_URL=sqlite:///./botshield.db
    volumes:
      - botshield-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  botshield-data:
